# Managed by open_wiki/scripts/run-openwiki.mjs.
name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # OpenWiki reads git history to see what changed; a shallow clone
          # starves it. Upstream fixed the same defect in its 0.3.0 example.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: open_wiki/package-lock.json

      - name: Install OpenWiki
        run: npm ci --prefix open_wiki

      # Optional peer dependencies. Without them OpenWiki falls back to a
      # lightweight Mermaid check; with them, validation matches what GitHub
      # actually renders, so no broken diagram ships. CI-only on purpose —
      # --no-save keeps them out of package.json and the lockfile.
      - name: Install Mermaid validation peers
        run: npm install --no-save --prefix open_wiki mermaid@11.16.0 jsdom@29.1.1

      - name: Refresh wiki with OpenAI
        run: npm run wiki:update --prefix open_wiki
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            open_wiki/wiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: "Automated OpenWiki documentation update using OpenAI."
